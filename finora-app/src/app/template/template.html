<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img class="logo-mark" src="finora-logo.svg" alt="" />
            <div class="logo-text">
                <span class="logo-wordmark"><span class="f">F</span><span class="ora">inora</span></span>
                <span class="logo-tagline">Inteligência <span>para finanças</span></span>
            </div>
        </div>
       <nav class="sidebar-menu" >
            <a class="menu-item" routerLink="/paginas" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a class="menu-item" routerLink="/paginas/cadastro-cartoes" routerLinkActive="active">
                <i class="fa-solid fa-credit-card"></i>
                <span>Cartões</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-tags"></i>
                <span>Categorias</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-receipt"></i>
                <span>Lançamentos</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Planejamento</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-file-lines"></i>
                <span>Relatórios</span>
            </a>
        </nav>
    </aside>
    <div class="main-content">
       
        <main class="main-content">
            <router-outlet></router-outlet>
        </main>
</div>
