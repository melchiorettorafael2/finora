<form [formGroup]="form" (ngSubmit)="handleSubmit()" class="form form-card form-modal">
    <div class="form-group">
        <label for="nome">Nome da Categoria <span class="required">*</span></label>
        <div class="input-icon">
            <i class="fa-solid fa-tag"></i>
            <input formControlName="nome" type="text" id="nome" name="nome" placeholder="Ex: Alimentação" />
        </div>
        @if(form.controls.nome.hasError('required') && form.controls.nome.touched){
            <span class="form-hint form-hint-error">
                <i class="fa-solid fa-circle-exclamation"></i> O nome da Categoria é obrigatório.
            </span>
        }
        @if(form.controls.nome.hasError('apiError') && form.controls.nome.touched){
            <span class="form-hint form-hint-error">
                <i class="fa-solid fa-circle-exclamation"></i> {{ form.controls.nome.errors?.['apiError'] }}
            </span>
        }
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancelado.emit()">Cancelar</button>
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-check"></i>
            {{ idCategoria() ? 'Atualizar' : 'Salvar' }}
        </button>
    </div>
</form>
