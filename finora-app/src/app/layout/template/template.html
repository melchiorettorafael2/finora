<div class="app-container" [class.tema-claro]="preferencias.tema() === 'claro'">
    <!-- Menu sempre minimizado; expande ao passar o mouse (ver .sidebar no styles.scss) -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img class="logo-img" src="finora-logo-sidebar@2x.png" srcset="finora-logo-sidebar@2x.png 2x, finora-logo-sidebar@3x.png 3x" alt="Finora" />
        </div>
        <nav class="sidebar-menu">
            @for (item of itensMenu; track item.rota) {
                <a class="menu-item" [routerLink]="item.rota" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: item.exato }"
                    [attr.aria-label]="item.rotulo">
                    <i class="fa-solid" [ngClass]="item.icone"></i>
                    <span>{{ item.rotulo }}</span>
                </a>
            }

            <!-- Configurações abre em modal, por cima da página atual -->
            <button type="button" class="menu-item" [class.active]="modais.configuracoesAberta()"
                aria-label="Configurações" (click)="modais.abrirConfiguracoes()">
                <i class="fa-solid fa-gear"></i>
                <span>Configurações</span>
            </button>
        </nav>
    </aside>

    <main class="main-content">
        <router-outlet></router-outlet>
    </main>

    @if (modais.configuracoesAberta()) {
        <app-modal titulo="Configurações" subtitulo="Seu perfil e a segurança da conta."
            icone="fa-gear" largura="media" (fechar)="modais.fecharConfiguracoes()">
            <app-configuracoes />
        </app-modal>
    }
</div>
