<div class="app-container" [class.tema-claro]="preferencias.tema() === 'claro'">
    <!-- Menu sempre minimizado; expande ao passar o mouse (ver .sidebar no styles.scss) -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img class="logo-img" src="finora-logo-sidebar@2x.png" srcset="finora-logo-sidebar@2x.png 2x, finora-logo-sidebar@3x.png 3x" alt="Finora" />
        </div>
        <nav class="sidebar-menu">
            @for (item of itensMenu; track item.rota) {
                <a class="menu-item" [routerLink]="item.rota" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: item.exato }"
                    [attr.aria-label]="item.rotulo">
                    <i class="fa-solid" [ngClass]="item.icone"></i>
                    <span>{{ item.rotulo }}</span>
                </a>
            }
        </nav>
    </aside>

    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
</div>
