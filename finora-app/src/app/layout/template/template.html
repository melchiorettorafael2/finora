<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img class="logo-img" src="finora-logo-sidebar@2x.png" srcset="finora-logo-sidebar@2x.png 2x, finora-logo-sidebar@3x.png 3x" alt="Finora" />
        </div>
       <nav class="sidebar-menu" >
            <a class="menu-item" routerLink="/paginas/listagem-cartoes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <i class="fa-solid fa-credit-card"></i>
                <span>Meus Cartões</span>
            </a>
            <a class="menu-item" routerLink="/paginas/listagem-categorias" routerLinkActive="active">
                <i class="fa-solid fa-icons"></i>
                <span>Categorias</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-receipt"></i>
                <span>Lançamentos</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Planejamento</span>
            </a>
            <a class="menu-item">
                <i class="fa-solid fa-file-lines"></i>
                <span>Relatórios</span>
            </a>
        </nav>
    </aside>
    <div class="main-content">
       
        <main class="main-content">
            <router-outlet></router-outlet>
        </main>
</div>
