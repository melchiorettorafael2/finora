spring:
  application:
    name: finora-api
  datasource:
    url: jdbc:h2:file:./data/finora-db
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
