# Perfil de produção (SPRING_PROFILES_ACTIVE=prod), usado no servidor da AWS.
# Os segredos vêm de variáveis de ambiente (arquivo .env no servidor, fora do Git):
#   APP_JWT_SECRET, APP_FRONT_URL e MAIL_* (ver application.yml)
spring:
  datasource:
    # Volume do Docker: o banco sobrevive a deploys e reinícios
    url: jdbc:h2:file:/data/finora-db
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      # Desligado por padrão. H2_CONSOLE=true no .env liga o console, que só é acessível
      # por túnel SSH (deploy/h2-console.sh): o Caddy bloqueia /api/h2-console e a porta 8080
      # só é publicada no localhost do servidor.
      enabled: ${H2_CONSOLE:false}
      settings:
        # Pelo túnel a requisição chega do gateway do Docker, não de 127.0.0.1
        web-allow-others: ${H2_CONSOLE:false}
app:
  demo:
    # Conta de demonstração pública (ContaDemo/DemoService): vazio desliga
    login: ${DEMO_LOGIN:}
    senha: ${DEMO_SENHA:}
  h2:
    # Servidor TCP do H2 para o DBeaver (H2TcpServerConfig), ligado junto com o console
    tcp: ${H2_CONSOLE:false}
  migracao:
    dono-dados-antigos: ""
